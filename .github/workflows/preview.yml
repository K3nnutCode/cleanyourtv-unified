name: Build preview APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test reversible screensaver setup
        shell: pwsh
        run: ./tests/Test-ScreensaverSetup.ps1 -WorkingDirectory "${{ runner.temp }}/cytv-screensaver-tests"
      - name: Test and build debug preview
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug
          python3 verify_apk.py "$ANDROID_HOME/build-tools/34.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signature and prepare preview
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/CleanYourTV-Unified-1.0.0-alpha01-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs preview/*.apk > preview/APK-Signature.txt
          cp NOTICE.md LICENSE FONT-LICENSE-OFL.txt README.md QUICK_START.md TRY_WITH_AGENT.md VERIFICATION.md Install-Test.ps1 Set-Screensaver.ps1 preview/
          git rev-parse HEAD > preview/SOURCE-COMMIT.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > preview/BUILD-RUN.txt
          cd preview
          sha256sum *.apk *.ps1 *.md LICENSE FONT-LICENSE-OFL.txt APK-Signature.txt SOURCE-COMMIT.txt BUILD-RUN.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cleanyourtv-unified-preview
          path: preview/
          retention-days: 30
