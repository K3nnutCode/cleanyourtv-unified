name: Build preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build debug preview
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          python3 verify_apk.py "$ANDROID_HOME/build-tools/34.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signature and prepare preview
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/CleanYourTV-Unified-1.0.0-alpha01-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs preview/*.apk > preview/APK-Signature.txt
          cp NOTICE.md LICENSE TRY_WITH_AGENT.md preview/
          cd preview
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-unified-preview
          path: preview/
          retention-days: 30
